# ── X-Now · CircleCI build pipeline (Linux + macOS installers) ─────────────
# This pipeline ONLY builds the installer packages and exposes them as
# downloadable artifacts. It does NOT touch GitHub — you download the files
# from CircleCI and attach them to the GitHub release yourself.
#
#   build-linux  -> AppImage, .deb, .rpm   (runs on the free Docker plan)
#   build-macos  -> .dmg (Apple Silicon + Intel)  (requires a paid CircleCI
#                   plan that includes macOS runners)
#
# ── How to run it ─────────────────────────────────────────────────────────
# 1. app.circleci.com → Projects → X-Now → Trigger Pipeline (top right)
# 2. Branch: main
# 3. Parameters → release-tag: type any value, e.g. v2.1.0
#    (the value is only a switch that turns the build on — it is not pushed
#     to GitHub)
# 4. Trigger Pipeline, wait for the two jobs to finish
# 5. Open each job → "Artifacts" tab → download the installer files
#
# Note: normal pushes to main run NO jobs (the workflow is gated on the
# `release-tag` parameter). macOS on CircleCI needs a paid plan; Linux builds
# work on the free plan. (GitHub Actions already builds macOS for free, so
# the .dmg files also come from the Actions run.)
version: 2.1

parameters:
  release-tag:
    type: string
    default: ""

executors:
  linux:
    docker:
      - image: cimg/rust:1.86.0
    resource_class: large
  macos:
    macos:
      xcode: "15.4.0"
    resource_class: macos.m1.medium.gen1

commands:
  setup-rust:
    description: Pin the latest stable Rust toolchain
    parameters:
      targets:
        type: string
        default: ""
    steps:
      - run:
          name: Setup Rust (stable)
          command: |
            rustup update stable
            rustup default stable
            if [ -n "<< parameters.targets >>" ]; then
              rustup target add << parameters.targets >>
            fi

  setup-node:
    description: Install Node.js 20 (Tauri CLI helpers)
    steps:
      - run:
          name: Install Node.js 20
          command: |
            set -e
            if [[ "$OSTYPE" == "darwin"* ]]; then
              curl -fsSL https://nodejs.org/dist/v20.11.1/node-v20.11.1-darwin-x64.tar.gz | sudo tar -xz -C /usr/local --strip-components=1
            else
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

  install-tauri-cli:
    description: Install the Tauri CLI (prebuilt via npm — fast on CI)
    steps:
      - run:
          name: Install Tauri CLI
          command: npm install -g @tauri-apps/cli@2

jobs:
  build-linux:
    executor: linux
    steps:
      - checkout
      - run:
          name: Install Linux system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              patchelf
      - setup-rust
      - setup-node
      - install-tauri-cli
      - run:
          name: Build Linux bundles (AppImage, deb, rpm)
          command: |
            cd src-tauri
            npx tauri build --bundles appimage,deb,rpm
      - store_artifacts:
          path: src-tauri/target/release/bundle/appimage
          destination: linux-appimage
      - store_artifacts:
          path: src-tauri/target/release/bundle/deb
          destination: linux-deb
      - store_artifacts:
          path: src-tauri/target/release/bundle/rpm
          destination: linux-rpm

  build-macos:
    executor: macos
    steps:
      - checkout
      - setup-rust:
          targets: "aarch64-apple-darwin x86_64-apple-darwin"
      - setup-node
      - install-tauri-cli
      - run:
          name: Build macOS bundle (Apple Silicon)
          command: |
            cd src-tauri
            npx tauri build --target aarch64-apple-darwin --bundles dmg
      - run:
          name: Build macOS bundle (Intel)
          command: |
            cd src-tauri
            npx tauri build --target x86_64-apple-darwin --bundles dmg
      - store_artifacts:
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          destination: macos-arm64-dmg
      - store_artifacts:
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg
          destination: macos-x64-dmg

workflows:
  release:
    when:
      and:
        - equal: [ main, << pipeline.git.branch >> ]
        - not:
            equal: [ "", << pipeline.parameters.release-tag >> ]
    jobs:
      - build-linux
      - build-macos
